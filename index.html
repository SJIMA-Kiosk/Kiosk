   Place classification. Same logic as the Python build, in the browser.
   ========================================================================== */

/* ==========================================================================
   Storage.

   Sign-ins live in localStorage on the iPad. They survive closing the tab,
   rebooting and days passing. Safari's "Clear History and Website Data"
   wipes them, which is the intended reset.

   Two caps bound growth. When either is hit, whole days are dropped oldest
   first, never a partial day, so the tally table never shows a half-counted
   date. A 9th-gen iPad gives Safari roughly 5 MB per origin; staying well
   under that avoids a mid-write quota throw.

   At ~30 sign-ins a day, 1.5 MB is over a year.
   ========================================================================== */

const STORE_KEY  = "sjima.signins.v1";
const MAX_BYTES  = 1500000;   // ~30% of Safari's per-origin allowance
const MAX_DAYS   = 400;

let STORAGE_OK = true;        // false in private browsing
let SUBMISSIONS = [];

function storageAvailable() {
  try {
    localStorage.setItem("sjima.probe", "1");
    localStorage.removeItem("sjima.probe");
    return true;
  } catch (e) { return false; }
}

/* Storage is the one input this page doesn't control: another tab, a botched
   restore or a half-finished write can leave anything in there. Every record
   is rebuilt to a known shape on the way in, so the rest of the code can
   assume its fields exist. */
function sanitiseVisit(v) {
  if (!v || typeof v !== "object") return null;
  const date = typeof v.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v.date)
    ? v.date : null;
  if (!date) return null;
  const rows = Array.isArray(v.rows) ? v.rows : [];
  const n = x => {
    const k = parseInt(x, 10);
    return Number.isFinite(k) ? Math.max(0, Math.min(999, k)) : 0;
  };
  const str = (x, cap) => (typeof x === "string" ? x : "").slice(0, cap);
  return {
    id: str(v.id, 16) || Math.random().toString(36).slice(2, 10),
    at: str(v.at, 16),
    date,
    name: str(v.name, 60),
    email: str(v.email, 80),
    members: n(v.members),
    rows: rows.filter(r => r && typeof r === "object").map(r => ({
      place: str(r.place, 80),
      count: n(r.count),
      paid_nights: n(r.paid_nights),
      free_nights: n(r.free_nights),
    })),
  };
}

function loadStore() {
  if (!STORAGE_OK) return [];
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const data = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(data)) return [];
    return data.map(sanitiseVisit).filter(Boolean);
  } catch (e) {
    // Corrupt or truncated: set the bad copy aside rather than destroy it.
    try { localStorage.setItem(STORE_KEY + ".damaged",
                               localStorage.getItem(STORE_KEY) || ""); } catch (e2) {}
    return [];
  }
}

function storeBytes(list) {
  return JSON.stringify(list === undefined ? SUBMISSIONS : list).length;
}

/* Drop whole days, oldest first, until both caps are satisfied. */
function pruneStore() {
  const days = [...new Set(SUBMISSIONS.map(v => v.date))].sort();
  let dropped = 0;
  while (days.length > MAX_DAYS ||
         (storeBytes() > MAX_BYTES && days.length > 1)) {
    const oldest = days.shift();
    SUBMISSIONS = SUBMISSIONS.filter(v => v.date !== oldest);
    dropped++;
  }
  return dropped;
}

function saveStore() {
  if (!STORAGE_OK) return;
  pruneStore();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(SUBMISSIONS));
  } catch (e) {
    // Quota hit anyway. Shed a quarter of the days and retry once, so the
    // sign-in in progress still gets recorded.
    const days = [...new Set(SUBMISSIONS.map(v => v.date))].sort();
    const cut = days.slice(0, Math.max(1, Math.ceil(days.length / 4)));
    SUBMISSIONS = SUBMISSIONS.filter(v => !cut.includes(v.date));
    try { localStorage.setItem(STORE_KEY, JSON.stringify(SUBMISSIONS)); }
    catch (e2) { STORAGE_OK = false; }
  }
}

STORAGE_OK = storageAvailable();
SUBMISSIONS = loadStore();

const STATE_ABBR = {
  al:"Alabama",ak:"Alaska",az:"Arizona",ar:"Arkansas",ca:"California",
  co:"Colorado",ct:"Connecticut",de:"Delaware",fl:"Florida",ga:"Georgia",
  hi:"Hawaii",id:"Idaho",il:"Illinois",in:"Indiana",ia:"Iowa",ks:"Kansas",
  ky:"Kentucky",la:"Louisiana",me:"Maine",md:"Maryland",ma:"Massachusetts",
  mi:"Michigan",mn:"Minnesota",ms:"Mississippi",mo:"Missouri",mt:"Montana",
  ne:"Nebraska",nv:"Nevada",nh:"New Hampshire",nj:"New Jersey",
  nm:"New Mexico",ny:"New York",nc:"North Carolina",nd:"North Dakota",
  oh:"Ohio",ok:"Oklahoma",or:"Oregon",pa:"Pennsylvania",ri:"Rhode Island",
  sc:"South Carolina",sd:"South Dakota",tn:"Tennessee",tx:"Texas",ut:"Utah",
  vt:"Vermont",va:"Virginia",wa:"Washington",wv:"West Virginia",
  wi:"Wisconsin",wy:"Wyoming",dc:"DC",bc:"British Columbia",ab:"Alberta",
  on:"Ontario",qc:"Quebec",mb:"Manitoba",ns:"Nova Scotia",sk:"Saskatchewan",
  nb:"New Brunswick",yt:"Yukon",
};

const CANADIAN = new Set(["British Columbia","Alberta","Ontario","Quebec",
  "Manitoba","Nova Scotia","Saskatchewan","New Brunswick","Yukon"]);

/* "From SJ Islands" on the tally sheet means San Juan County, not proximity
   to Friday Harbor. Anacortes is 18 miles out and doesn't count. */
const SAN_JUAN = new Set(PLACES.san_juan || []);

function normKey(s) {
  return (s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[.\-']/g, " ").replace(/\s+/g, " ").trim();
}

const BY_NAME = {};
for (const t of PLACES.towns) {
  const k = normKey(t[0]);
  (BY_NAME[k] = BY_NAME[k] || []).push(t);
}

const COUNTRY_BY_ALIAS = {};
for (const [display, aliases] of PLACES.countries) {
  for (const a of aliases) COUNTRY_BY_ALIAS[normKey(a)] = display;
}
const US_NAMES = new Set(["usa","us","united states","america",
                          "united states of america"]);

function splitPlace(raw) {
  const parts = raw.split(",").map(p => p.trim()).filter(Boolean);
  if (!parts.length) return ["", ""];
  const head = normKey(parts[0]);
  for (let i = 1; i < parts.length; i++) {
    const n = normKey(parts[i]);
    if (US_NAMES.has(n)) continue;
    return [head, n];
  }
  return [head, ""];
}

function classify(place) {
  const raw = (place || "").trim();
  if (!raw) return { resolved:"", matched:false, fifty:false, away:false,
                     miles:null, sj:false };

  // A place picked from the online geocoder: its coordinates were stored when
  // it was chosen, so it resolves properly now even with no network.
  const cached = PLACE_CACHE[raw.toLowerCase()];
  if (cached) {
    const mi = milesFromFH(cached.lat, cached.lon);
    const us = !cached.country || cached.country === "US";
    return {
      resolved: raw, matched: true,
      fifty: mi >= PLACES.radius,
      away: !us || cached.admin1 !== "Washington",
      miles: Math.round(mi * 10) / 10,
      sj: us && SAN_JUAN.has(normKey((raw.split(",")[0] || "").trim())),
    };
  }

  const whole = normKey(raw);
  const [head, tail] = splitPlace(raw);

  // A bare country: "China", "England", "Holland", "PRC".
  if (!BY_NAME[whole]) {
    const c = COUNTRY_BY_ALIAS[whole];
    if (c) {
      const intl = c !== "United States";
      return { resolved:c, matched:true, fifty:true, away:intl, miles:null, sj:false };
    }
  }

  // A town with coordinates.
  let hits = BY_NAME[head];
  if (hits) {
    if (tail) {
      const want = normKey(STATE_ABBR[tail] || tail);
      const narrowed = hits.filter(h => normKey(h[3]) === want);
      if (narrowed.length) hits = narrowed;
    }
    let best = hits[0], bestMi = milesFromFH(hits[0][1], hits[0][2]);
    for (const h of hits) {
      const mi = milesFromFH(h[1], h[2]);
      if (mi < bestMi) { best = h; bestMi = mi; }
    }
    const intl = best[4] !== "US";
    return {
      // labelOf takes an object, while the bundled list is packed as arrays.
      resolved: labelOf({ name: best[0], admin1: best[3], country: best[4] }),
      matched: true,
      fifty: bestMi >= PLACES.radius,
      away: intl || best[3] !== "Washington",
      miles: Math.round(bestMi * 10) / 10,
      sj: best[4] === "US" && SAN_JUAN.has(normKey(best[0])),
    };
  }

  // Unknown town, known country or state: "Chengdu, China".
  if (tail) {
    const headDisp = raw.split(",")[0].trim();
    const c = COUNTRY_BY_ALIAS[tail];
    if (c) {
      const intl = c !== "United States";
      return { resolved:`${headDisp}, ${c}`, matched:true,
               fifty:true, away:intl, miles:null, sj:false };
    }
    let st = STATE_ABBR[tail];
    if (!st) {
      const full = Object.values(STATE_ABBR).find(v => normKey(v) === tail);
      if (full) st = full;
    }
    if (st) {
      return { resolved:`${headDisp}, ${st}`, matched:true, fifty:true,
               away: CANADIAN.has(st) || st !== "Washington", miles:null, sj:false };
    }
  }

  // Nothing matched: count it, but flag it.
  return { resolved: raw, matched:false, fifty:true, away:true, miles:null, sj:false };
}

/* ==========================================================================
   Review screen
   ========================================================================== */

function blankTally() {
  return { visitors:0, sj:0, fifty:0, away:0, paidPeople:0, paidNights:0,
           freePeople:0, members:0, unplaced:0, review:new Set() };
}

function addRow(t, row) {
  // Anyone who taps Submit is in the building, so they count toward overall
  // attendance even with no town entered. They can't count toward any origin
  // category, since there's nothing to classify. The categories aren't meant
  // to sum to the total: there is no bucket for "off-island but under 50
  // miles".
  if (!row.place) {
    t.visitors += row.count;
    t.unplaced += row.count;
    return null;
  }
  const f = classify(row.place);
  if (!f.matched) t.review.add(row.place);
  const n = row.count;
  t.visitors += n;
  if (f.sj)    t.sj    += n;
  if (f.fifty) t.fifty += n;
  if (f.away)  t.away  += n;
  if (row.paid_nights) { t.paidPeople += n; t.paidNights += n * row.paid_nights; }
  if (row.free_nights) t.freePeople += n;
  return f;
}

function byDay() {
  const days = new Map();
  for (const v of SUBMISSIONS) {
    if (!inRange(v.date)) continue;
    if (!days.has(v.date)) days.set(v.date, []);
    days.get(v.date).push(v);
  }
  return days;
}

function esc(t) {
  return String(t).replace(/[&<>"]/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}

/* Tally sheet, one row per day, matching the columns already in use. Grant
   item codes sit under the headings so the two line up at a glance. */
const COLS = [
  ["# of<br>Visitors",            "i.",   "visitors"],
  ["From SJ<br>Islands",          "",     "sj"],
  ["50+ miles<br>away",           "ii.",  "fifty"],
  ["Out of State or<br>International", "ii.a", "away"],
  ["Paid<br>lodging",             "ii.b", "paidPeople"],
  ["Total paid<br>lodging nights","ii.d", "paidNights"],
  ["Unpaid<br>Lodging",           "ii.c", "freePeople"],
  ["Member of<br>Museum",         "",     "members"],
];

/* The visible date window. null means every date on file. */
let RANGE = { from: null, to: null };

function inRange(iso) {
  if (RANGE.from && iso < RANGE.from) return false;
  if (RANGE.to   && iso > RANGE.to)   return false;
  return true;
}

function rangeNote() {
  if (!RANGE.from && !RANGE.to) return "";
  const pretty = iso => new Date(iso + "T12:00:00")
    .toLocaleDateString(undefined, { month:"long", day:"numeric", year:"numeric" });
  const what = RANGE.from && RANGE.to
    ? pretty(RANGE.from) + " to " + pretty(RANGE.to)
    : RANGE.from ? "on or after " + pretty(RANGE.from)
                 : "on or before " + pretty(RANGE.to);
  const kept = new Set(SUBMISSIONS.filter(v => inRange(v.date)).map(v => v.date)).size;
  return `<div class="rangenote">Showing <b>${what}</b> &mdash; ${kept} day${
    kept === 1 ? "" : "s"} with sign-ins.</div>`;
}

function renderReview() {
  const days = byDay();
  const grand = blankTally();
  const dayRows = [];

  for (const [date, visits] of [...days.entries()].sort()) {
    const t = blankTally();
    for (const v of visits) {
      for (const r of v.rows) { addRow(t, r); addRow(grand, r); }
      // Members is one number for the whole group, not per town.
      t.members += v.members || 0;
      grand.members += v.members || 0;
    }
    dayRows.push([date, t]);
  }

  const head = "<tr><th>Day</th>" + COLS.map(([h, code]) =>
    `<th>${h}${code ? `<em>${code}</em>` : ""}</th>`).join("") + "</tr>";

  /* Weeks run Tuesday to Monday, matching the existing spreadsheet: every
       week in it ends on a Monday and none contains a Tuesday. Change
       WEEK_START to shift it: 0 Sunday, 1 Monday, 2 Tuesday. */
  const WEEK_START = 2;
  const weekKeyOf = iso => {
    const d = new Date(iso + "T12:00:00");
    const back = (d.getDay() - WEEK_START + 7) % 7;
    d.setDate(d.getDate() - back);
    return d.toISOString().slice(0, 10);
  };
  const weekLabel = k => {
    const a = new Date(k + "T12:00:00");
    const b = new Date(a); b.setDate(b.getDate() + 6);
    const f = d => d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
    return "Week of " + f(a) + " \u2013 " + f(b);
  };

  // Days with no sign-ins are never stored, so the last row is the most
  // recent day with data. That's the row to copy into the spreadsheet, so
  // mark it rather than leaving it to be found.
  const latestIso = dayRows.length ? dayRows[dayRows.length - 1][0] : null;

  const body = [];
  let wk = null, wkTally = null, wkCount = 0;
  const flushWeek = () => {
    if (!wkTally) return;
    // A single-day week would just repeat that row, so skip it.
    if (wkCount > 1) {
      body.push('<tr class="wk"><td class="day">' + weekLabel(wk) + "</td>" +
        COLS.map(([, , k]) => `<td>${wkTally[k]}</td>`).join("") + "</tr>");
    }
    body.push('<tr class="gap"><td colspan="' + (COLS.length + 1) + '"></td></tr>');
  };

  for (const [date, t] of dayRows) {
    const k = weekKeyOf(date);
    if (k !== wk) { flushWeek(); wk = k; wkTally = blankTally(); wkCount = 0; }
    for (const f of Object.keys(wkTally)) {
      if (typeof wkTally[f] === "number") wkTally[f] += t[f];
    }
    wkCount++;
    const d = new Date(date + "T12:00:00");
    const label = d.toLocaleDateString(undefined,
      { weekday:"short", month:"short", day:"numeric" });
    const latest = date === latestIso;
    body.push(`<tr class="${latest ? "latest" : ""}"><td class="day">${label}${
      latest ? ' <em>latest</em>' : ""}</td>` +
      COLS.map(([, , k2]) => `<td>${t[k2]}</td>`).join("") + "</tr>");
  }
  flushWeek();

  const totalRow = `<tr class="grand"><td class="day">Total</td>` +
    COLS.map(([, , k]) => `<td>${grand[k]}</td>`).join("") + "</tr>";

  const table = dayRows.length
    ? `<table class="tally">${head}${body.join("")}${totalRow}</table>`
    : "";

  const bits = [];
  if (grand.review.size) bits.push(
    `Counted as 50+ miles but not recognised, so worth a look: <b>${
      [...grand.review].map(esc).join(", ")}</b>.`);
  if (grand.unplaced) bits.push(
    `${grand.unplaced} visitor${grand.unplaced !== 1 ? "s" : ""} left the town blank.
     ${grand.unplaced !== 1 ? "They are" : "That one is"} counted in
     <b>#&nbsp;of&nbsp;Visitors</b> but in none of the origin columns, so the
     columns will not add up to the total. They never do: there is no column
     for off-island but under 50 miles.`);
  const note = bits.length ? `<div class="note">${bits.join(" ")}</div>` : "";

  const cards = SUBMISSIONS.filter(v => inRange(v.date))
      .slice(-SHOW_LIMIT).reverse().map(v => {
    const rows = v.rows.map(r => {
      if (!r.place) return `<div class="r">
        <div class="what"><span class="raw">no town given, counted in attendance only</span></div>
        <span class="pill">${r.count} ${r.count === 1 ? "person" : "people"}</span></div>`;
      const f = classify(r.place);
      const cls = f.matched ? "usable" : "review";
      const what = f.matched
        ? esc(f.resolved) + (f.resolved.toLowerCase() !== r.place.toLowerCase()
            ? ` <span class="raw">&nbsp;&larr; ${esc(r.place)}</span>` : "")
        : `${esc(r.place)} <span class="raw">&nbsp;not recognised</span>`;
      const tags = [
        `${r.count} ${r.count === 1 ? "person" : "people"}`,
        f.sj ? "San Juan County" : null,
        f.miles === null ? null : `${Math.floor(f.miles)} mi`,
        r.paid_nights ? `${r.paid_nights} paid` : null,
        r.free_nights ? `${r.free_nights} free` : null,
      ].filter(Boolean).map(x => `<span class="pill">${x}</span>`).join("");
      return `<div class="r ${cls}"><div class="what">${what}</div>${tags}</div>`;
    }).join("");
    const who = v.name ? esc(v.name) : '<span class="anon">no name given</span>';
    const mem = v.members
      ? `<span>${v.members} museum member${v.members === 1 ? "" : "s"}</span>` : "";
    return `<div class="visit" data-vid="${esc(v.id)}">
      <button class="vhead" type="button" aria-expanded="false">
        <span class="vchev" aria-hidden="true">&#9656;</span>
        <span class="who">${who}</span>
        ${v.email ? `<span>${esc(v.email)}</span>` : ""}${mem}<span>${esc(v.at)}</span>
      </button>${rows}${visitDetail(v)}</div>`;
  }).join("");

  document.getElementById("reviewBody").innerHTML =
    rangeNote() + table + note + storageLine() +
    (cards ? `<h3 class="rsub">Everyone who signed in${
               SUBMISSIONS.length > SHOW_LIMIT
                 ? ` <span class="rnote">(most recent ${SHOW_LIMIT} of ${SUBMISSIONS.length})</span>`
                 : ""}</h3>${cards}`
           : '<div class="rempty">Nobody has signed in yet.</div>');
}

/* Everything stored for one sign-in, exactly as it was entered, plus what the
   tally made of it. Hidden until the card is tapped. The review screen is
   re-rendered every time it opens, so these always start closed. */
function visitDetail(v) {
  const none = '<span class="anon">not given</span>';
  const dt = new Date(v.date + "T12:00:00").toLocaleDateString(undefined,
    { weekday: "long", month: "long", day: "numeric", year: "numeric" });

  const facts = [
    ["Signed in", esc(dt) + (v.at ? " at " + esc(v.at) : "")],
    ["Name", v.name ? esc(v.name) : none],
    ["Email", v.email ? esc(v.email) : none],
    ["Museum member", v.members
      ? `Yes, counted ${v.members} ${v.members === 1 ? "person" : "people"}`
      : "Not ticked"],
  ];

  const towns = v.rows.map((r, i) => {
    const f = classify(r.place);
    const nights = r.count * r.paid_nights;
    const bits = [
      ["Typed", r.place ? esc(r.place) : none],
      ["Recognised as", r.place
        ? (f.matched ? esc(f.resolved) : '<span class="anon">not recognised</span>')
        : none],
      ["Distance from Friday Harbor",
        f.miles === null ? '<span class="anon">unknown</span>'
                         : `${Math.floor(f.miles)} miles`],
      ["San Juan County", r.place ? (f.sj ? "Yes" : "No") : none],
      ["50+ miles away", r.place ? (f.fifty ? "Yes" : "No") : none],
      ["Out of state or international", r.place ? (f.away ? "Yes" : "No") : none],
      ["People", String(r.count)],
      ["Nights in paid lodging", String(r.paid_nights)],
      ["Nights with friends or family", String(r.free_nights)],
      ["Paid lodging nights counted", r.paid_nights
        ? `${nights} &nbsp;<span class="raw">(${r.count} &times; ${r.paid_nights})</span>`
        : "0"],
    ];
    return `<div class="vblock"><div class="vbh">Town ${i + 1} of ${v.rows.length}</div>` +
      bits.map(([k, val]) => `<div class="vrow"><span>${k}</span><span>${val}</span></div>`)
          .join("") + `</div>`;
  }).join("");

  const t = blankTally();
  v.rows.forEach(r => addRow(t, r));
  t.members = v.members;
  const contrib = COLS.map(([label, code, key]) =>
    `<div class="vrow"><span>${label.replace(/<br>/g, " ")}${
       code ? ` <span class="raw">${code}</span>` : ""}</span><span>${t[key]}</span></div>`
  ).join("");

  return `<div class="vdetail" hidden>
    <div class="vblock">` +
      facts.map(([k, val]) => `<div class="vrow"><span>${k}</span><span>${val}</span></div>`)
           .join("") + `</div>${towns}
    <div class="vblock"><div class="vbh">What this sign-in added to the tally</div>${contrib}</div>
    <div class="vdel"><button type="button" class="delbtn" data-del="${esc(v.id)}"
      >Delete this sign-in</button></div>
  </div>`;
}

const SHOW_LIMIT = 60;

function storageLine() {
  if (!STORAGE_OK) {
    return `<div class="note"><b>Nothing is being saved on this iPad.</b>
      Safari is in private browsing, or storage is blocked. Sign-ins will be
      lost when this page closes.</div>`;
  }
  const bytes = storeBytes();
  const days = new Set(SUBMISSIONS.map(v => v.date)).size;
  const pct = Math.min(100, Math.round(bytes / MAX_BYTES * 100));

  return `<div class="storeline">
    <div class="bar"><i style="width:${Math.max(pct, 1)}%"></i></div>
    <span>${SUBMISSIONS.length} sign-in${SUBMISSIONS.length === 1 ? "" : "s"}
      across ${days} day${days === 1 ? "" : "s"} &middot;
      ${(bytes / 1024).toFixed(0)} KB of ${(MAX_BYTES / 1024 / 1024).toFixed(1)} MB used.
      Oldest days are removed automatically when it fills.</span>
  </div>`;
}

/* Date range */
const isoOf = d => d.toLocaleDateString("en-CA");
function applyRange(from, to) {
  RANGE = { from: from || null, to: to || null };
  document.getElementById("rFrom").value = RANGE.from || "";
  document.getElementById("rTo").value   = RANGE.to   || "";
  renderReview();
}
document.getElementById("rApply").addEventListener("click", () => {
  let f = document.getElementById("rFrom").value || null;
  let t = document.getElementById("rTo").value || null;
  // A backwards range would silently show nothing, so swap the ends.
  if (f && t && f > t) { const x = f; f = t; t = x; }
  applyRange(f, t);
});
document.getElementById("rAll").addEventListener("click", () => applyRange(null, null));
document.querySelectorAll("[data-range]").forEach(b => {
  b.addEventListener("click", () => {
    const v = b.dataset.range;
    const today = new Date();
    if (v === "season") {
      // The lodging-tax reporting year: Jan 1 to today.
      applyRange(today.getFullYear() + "-01-01", isoOf(today));
    } else {
      const back = new Date(today);
      back.setDate(back.getDate() - (parseInt(v, 10) - 1));
      applyRange(isoOf(back), isoOf(today));
    }
  });
});

/* Auto-return.

   A visitor who wanders onto the data page has no obvious way back, so after
   30 seconds without a touch it returns to the sign-in page on its own. The
   timer only runs while the data page is open; on the sign-in page there is
   nowhere to return to, so nothing is scheduled and a half-typed entry is
   never disturbed.

   Staff can switch it off from the data page to read without it jumping away.
   The choice is remembered on the device. The thank-you screen runs its own
   separate timer and is not affected either way. */
const RETURN_KEY = "sjima.autoreturn.v1";
const RETURN_MS  = 30000;

let autoReturn = true;
try { autoReturn = localStorage.getItem(RETURN_KEY) !== "off"; } catch (e) {}

let returnTimer = null;
let modalOpen = false;        // a confirm() is up; don't close behind it

function reviewIsOpen() {
  return document.getElementById("review").classList.contains("show");
}

function clearReturnTimer() {
  if (returnTimer) { clearTimeout(returnTimer); returnTimer = null; }
}

function armReturnTimer() {
  clearReturnTimer();
  if (!autoReturn || !reviewIsOpen() || modalOpen) return;
  returnTimer = setTimeout(() => {
    returnTimer = null;
    if (autoReturn && reviewIsOpen() && !modalOpen) closeReview();
  }, RETURN_MS);
}

function openReview() {
  // Always opens on the full history. A date range someone set earlier is
  // theirs for that visit only; coming back to a filtered page and mistaking
  // it for the whole record is how a day goes missing from the report.
  // applyRange clears the range, resets both date fields and re-renders.
  applyRange(null, null);
  document.getElementById("review").classList.add("show");
  armReturnTimer();
}

function closeReview() {
  clearReturnTimer();
  document.getElementById("review").classList.remove("show");
}

/* Any touch, key or scroll inside the data page counts as activity. Captured
   at the document so it still registers on controls that stop propagation. */
["pointerdown", "keydown", "wheel", "input", "change", "scroll"].forEach(ev =>
  document.addEventListener(ev, () => { if (reviewIsOpen()) armReturnTimer(); },
                            { capture: true, passive: true }));

function paintReturnBtn() {
  const b = document.getElementById("reviewReturn");
  if (!b) return;
  b.textContent = autoReturn ? "Auto-return: on" : "Auto-return: off";
  b.setAttribute("aria-pressed", autoReturn ? "true" : "false");
  b.title = autoReturn
    ? "Returns to the sign-in page after 30 seconds without a touch."
    : "Stays on this page. Turn back on before the desk opens.";
}


document.getElementById("peek").addEventListener("click", ev => {
  ev.preventDefault();
  openReview();
});
document.getElementById("reviewClose").addEventListener("click", closeReview);

/* Remove one sign-in. The prompt names whose it is, because the cards look
   alike and the totals move underneath. Deleting re-renders in place rather
   than reopening the page, so the date range being looked at is kept. */
function deleteVisit(id) {
  const v = SUBMISSIONS.find(x => x.id === id);
  if (!v) { renderReview(); return; }
  const who = v.name ? v.name : "No name given";
  const when = new Date(v.date + "T12:00:00").toLocaleDateString(undefined,
    { month: "long", day: "numeric", year: "numeric" });
  const people = v.rows.reduce((n, r) => n + r.count, 0);

  modalOpen = true;
  clearReturnTimer();
  const ok = confirm("Delete this sign-in?\n\n" + who + "\n" + when +
                     (v.at ? " at " + v.at : "") + "\n" +
                     people + (people === 1 ? " person" : " people") +
                     "\n\nThis cannot be undone, and the totals for that day " +
                     "will change.");
  modalOpen = false;
  armReturnTimer();
  if (!ok) return;

  const i = SUBMISSIONS.findIndex(x => x.id === id);
  if (i !== -1) SUBMISSIONS.splice(i, 1);
  saveStore();
  renderReview();
  click("key");
}

/* Tap a sign-in to see everything it holds. Expanding is an ordinary tap, so
   the auto-return timer resets with it and still fires 30 seconds later. */
document.getElementById("reviewBody").addEventListener("click", ev => {
  const del = ev.target.closest("[data-del]");
  if (del) { deleteVisit(del.dataset.del); return; }

  const head = ev.target.closest(".vhead");
  if (!head) return;
  const open = head.getAttribute("aria-expanded") === "true";
  head.setAttribute("aria-expanded", open ? "false" : "true");
  const panel = head.parentElement.querySelector(".vdetail");
  if (panel) panel.hidden = open;
  click("key");
});

document.getElementById("reviewReturn").addEventListener("click", () => {
  autoReturn = !autoReturn;
  try { localStorage.setItem(RETURN_KEY, autoReturn ? "on" : "off"); } catch (e) {}
  paintReturnBtn();
  armReturnTimer();
  click("key");
});
paintReturnBtn();
/* Guided Access puts the iPad's own settings out of reach mid-shift, so the
   click has to be switchable from inside the app. */
function paintSoundBtn() {
  const b = document.getElementById("reviewSound");
  if (b) b.textContent = soundOn ? "Sound: on" : "Sound: off";
}
document.getElementById("reviewSound").addEventListener("click", () => {
  setSound(!soundOn);
  paintSoundBtn();
  click("key");
});
paintSoundBtn();

document.getElementById("reviewClear").addEventListener("click", () => {
  const n = SUBMISSIONS.length;
  if (!n) return;
  modalOpen = true;
  clearReturnTimer();
  const go = confirm("Delete all " + n + " stored sign-ins? This cannot be undone.\n\n" +
                     "Export first if you still need the numbers.");
  modalOpen = false;
  armReturnTimer();
  if (!go) return;
  SUBMISSIONS = [];
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  renderReview();
});


document.querySelector(".peek-date").textContent =
  new Date().toLocaleDateString(undefined,
    { month: "long", day: "numeric", year: "numeric" });

</script>
</body>
</html>
