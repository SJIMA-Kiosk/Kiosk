<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SJIMA Sign-In</title>
<!-- Launched from the Home Screen this runs standalone, no Safari chrome.
     Also keeps the data: Safari evicts localStorage after 7 idle days,
     standalone web apps are exempt. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent lets the page run under the status bar instead of
     below a reserved strip. The clock and battery still draw (no web app
     can hide them) but land on the masthead in white. The header pays the
     space back with safe-area padding, below. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SJIMA Sign-In">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4A2140">
<style>
  /* High-contrast palette. Every text/background pair meets WCAG AA at these
       sizes, most meet AAA. Heavy borders are deliberate; hairlines don't read
       at arm's length. */
  /* Theme tokens.

       Four palettes. Body text meets AAA (7:1) in all four, nothing falls below
       AA. The blue is built on U.S. Web Design System tokens.

       The keyboard is deliberately not themed. Keys stay near-white with
       near-black text in every palette; legibility beats colour coordination. */
  :root {
    /* Camas, after the purple lily on the island prairies, and a cousin of
       the purple in the wordmark. Warmer and lower-contrast in feel than the
       federal navy, without giving up any of the measured contrast: body text
       still clears AAA and no pairing falls below AA. */
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
             Georgia, serif;
    --ink:     #4A2140;   /* header, body text            */
    --primary: #7E3462;   /* headings, secondary buttons  */
    --accent:  #8E3A6C;   /* small labels, links          */
    --paper:   #FCF4F8;   /* blush, not grey              */
    --panel:   #FFFFFF;
    --edge:    #8C6E80;
    --edge-lt: #A8839A;
    --muted:   #5E3550;
    --sea:     #7E3462;
    --focus:   #7D4A00;   /* the field being typed into   */
    --focusbg: #FFF3DC;
    --tint:    #F7E9F1;   /* soft fill that follows the theme */

    /* The Submit button gets its own accent rather than the theme's primary,
       so it reads as the one thing to press. Gold against navy is the classic
       complement; it holds up against the green and brick palettes too. */
    /* Submit and Add are the same ruby on purpose. One family reads as a
       palette; three warm hues read as a collision. They are told apart by
       weight rather than by colour: Submit is filled solid with a white
       label, Add is a dashed outline on a pale rose. That is also the right
       hierarchy, since Submit is the one thing everyone must press. */
    --go:      #A8215C;   /* Submit button face           */
    --go-ink:  #FFFFFF;   /* its label                    */
    --go-edge: #7C1743;   /* the lip it sits on           */

    /* Add another town gets a ruby of its own rather than the theme's own
       colour. It is the only other thing on the page worth pressing, and a
       red against the plum reads as an invitation rather than a warning at
       this weight. */
    --add:     #A8215C;
    --add-bg:  #FBEEF4;

    /* constant across themes */
    --key:     #FFFFFF;
    --keyedge: #8B7684;
    --keyface: #EDE4EA;
    --keyink:  #2E1F29;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%; overflow: hidden; overflow-x: hidden;
    background: var(--paper); color: var(--ink);
    font-family: "Inter", "Segoe UI", "DejaVu Sans", system-ui, sans-serif;
    font-size: 20px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;      /* no long-press copy/define menu   */
    -webkit-text-size-adjust: 100%;   /* iOS must not resize our type     */
    touch-action: manipulation;       /* no double-tap zoom               */
    overscroll-behavior: none;        /* no rubber-band bounce            */
  }

  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- masthead ---------- */
  header {
    background: var(--ink); color: #fff; flex: none;
    padding: .55rem 1.3rem;
    /* iOS standalone starts the page under the status bar, so add the inset
           iOS reports. Elsewhere env() is 0 and this is the plain .55rem. */
    padding-top: calc(.55rem + env(safe-area-inset-top, 0px));
    padding-left: calc(1.3rem + env(safe-area-inset-left, 0px));
    padding-right: calc(1.3rem + env(safe-area-inset-right, 0px));
    display: flex; align-items: center; justify-content: space-between;
  }
  /* Traced outline filled with currentColor, so the mark picks up the header
     colour in every theme instead of shipping four images. */
  .logo { height: 40px; width: auto; display: block; color: #fff; flex: none; }
  .headtools { display: flex; align-items: stretch; gap: .5rem; }
  .refresh {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: .05rem;
    background: none; color: #fff; font-family: inherit; cursor: pointer;
    border: 1px solid rgba(255,255,255,.45); border-radius: 12px;
    padding: .3rem .7rem;
  }
  .refresh:active { background: rgba(255,255,255,.18); }
  .refresh .ico { font-size: 1rem; line-height: 1; }
  .refresh .lbl { font-size: .7rem; font-weight: 600; letter-spacing: .01em; }

  .peek {
    display: flex; flex-direction: column; align-items: flex-end; gap: .1rem;
    color: #fff; text-decoration: none;
    border: 1px solid rgba(255,255,255,.45); border-radius: 12px;
    padding: .3rem .7rem;
  }
  .peek:active { background: rgba(255,255,255,.18); }
  .peek-date { font-size: .82rem; opacity: .9; }
  .peek-cta  { font-size: .74rem; font-weight: 600; letter-spacing: .01em; }

  /* ---------- form area ---------- */
  main {
    flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; min-height: 0;
    padding: .65rem 1.3rem .8rem;
  }

  .identity { display: flex; gap: 1rem; margin-bottom: .6rem;
               align-items: end; }
  .identity > div { flex: 1 1 0; min-width: 0; }
  .identity .memcell { flex: 0 0 15rem; }
  .memberbtn {
    display: flex; align-items: center; gap: .6rem; width: 100%;
    min-height: 46px; padding: 0 .7rem;
    background: var(--panel); border: 2px solid var(--edge);
    border-radius: 14px; font-family: inherit; font-size: 1.08rem;
    font-weight: 600; color: var(--ink); cursor: pointer; text-align: left;
  }
  .memberbtn .box {
    flex: none; width: 1.5rem; height: 1.5rem; border-radius: 8px;
    border: 2px solid var(--edge); background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .memberbtn[aria-pressed="true"] {
    border-color: var(--sea); background: var(--tint);
  }
  .memberbtn[aria-pressed="true"] .box {
    background: var(--sea); border-color: var(--sea);
  }
  .memberbtn[aria-pressed="true"] .box::after {
    content: ""; width: .45rem; height: .8rem; margin-top: -.18rem;
    border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg);
  }
  .quiet-label {
    display: block; font-size: .98rem; color: var(--muted);
    margin-bottom: .25rem; font-weight: 500;
  }

  /* A book serif for the questions. Every face here ships with iOS or
     Windows, so nothing is fetched and nothing falls back to Times. It reads
     as a museum label rather than as a form field, which is most of what
     makes the page feel less clerical. */
  h2 {
    font-family: var(--serif);
    font-size: 1.44rem; font-weight: 600; margin: 0 0 .12rem;
    letter-spacing: 0;
  }

  /* Town blocks per row, with no media query. The percentage in the clamp is
       what caps it at two:

         46% x 2 = 92%   two fit
         46% x 3 = 138%  three never do

       Below ~700px the 320px floor takes over and one fits. Above ~2700px the
       620px ceiling takes over and three or more can appear. Tracks are
       minmax(0,1fr)-safe, so a long place name ellipsises instead of widening
       the page. */
  /* Flex rather than grid: the trailing button must not be as wide as a town
       block while sharing a row with one.

         1 town  + button   one row; the town takes ~2x the width (grow 3 vs 1)
         2 towns + button   46% x 2 leaves no room, so the button wraps to its
                            own row and the towns split the row evenly

       Same clamp behaviour as above: one per row below ~700px, three or more
       above ~2700px. */
  .towngrid { display: flex; flex-wrap: wrap; gap: .6rem; align-items: start; }

  .town {
    flex: 3 1 clamp(320px, 46%, 620px);
    min-width: 0;
    border: 2px solid var(--edge-lt); border-radius: 17px;
    box-shadow: 0 1px 3px rgba(40, 25, 55, .055);
    background: #FFFAFC; padding: .55rem .6rem .6rem;
  }
  .town-top { display: flex; gap: .4rem; align-items: center; min-width: 0; }
  .town-top .field { flex: 1 1 auto; min-width: 0; }

  .nums { display: flex; gap: .45rem; margin-top: .38rem; min-width: 0;
          align-items: end; }
  .stepper { display: flex; align-items: stretch; gap: .25rem; min-width: 0; }
  .stepper .field { flex: 1 1 0; min-width: 0; }
  .step {
    flex: 0 0 2.5rem; min-width: 0;
    background: var(--add-bg); color: var(--go);
    border: 2px solid var(--go); border-radius: 14px;
    font-family: inherit; font-size: 1.5rem; font-weight: 700; line-height: 1;
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  /* Hidden until the number beside them is being edited. Opacity rather than
     display or visibility toggling, so the buttons keep their boxes and the
     row never reflows: the numbers sit in exactly the same place either way.
     While hidden they still take taps, and that first tap focuses the number
     instead of changing it, so the footprint reads as "tap here to adjust". */
  .step { opacity: 0; transition: opacity .13s ease; }
  .step.on { opacity: 1; }
  .step:active { background: var(--go); color: #fff; border-color: var(--go); }
  .stepper.small .step { flex: 0 0 2.4rem; font-size: 1.35rem; }
  .numcell {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; gap: .2rem;
  }
  /* These explain what each box wants, and the visitors reading them are
     old. Sized as large as the page can carry: this value is for tall
     screens, and the compact block below steps it down only as far as a
     short landscape iPad actually requires. */
  .numcell > span {
    font-size: .98rem; line-height: 1.22; color: var(--muted);
    font-weight: 600; text-align: center;
  }

  .field {
    background: var(--panel);
    border: 2px solid var(--edge);
    border-radius: 14px;
    min-height: 56px; padding: 0 .7rem;
    display: flex; align-items: center;
    font-size: 1.1rem; color: var(--ink);
    overflow: hidden; white-space: nowrap;
  }
  .field.num { justify-content: center; padding: 0 .2rem; min-height: 50px;
               font-variant-numeric: tabular-nums; font-weight: 700;
               font-size: 1.2rem; }
  .field.small { min-height: 46px; font-size: 1.02rem; border-color: var(--edge-lt); }
  .field.active {
    border-color: var(--focus); background: var(--focusbg);
    box-shadow: 0 0 0 4px rgba(168,106,0,.3);
  }
  /* Shown in capitals, stored in proper case.

       Capitals read better at arm's length and remove any question of shift.
       Doing it in CSS keeps the record as "Friday Harbor, Washington" rather
       than "FRIDAY HARBOR, WASHINGTON", so what goes into the report and into
       LGL is clean. Email is left alone; addresses get handed to other
       systems. */
  /* Small caps rather than full capitals. The capital a visitor's name or town
     already starts with stays full height and everything after it becomes a
     smaller capital, so there is still no lower case to think about and no
     shift key to find, but the result reads as typography instead of as
     shouting. The stored value keeps its real case either way. Safari has
     supported this since iOS 9.3 and synthesises the small capitals when the
     font has none of its own. */
  .field[data-key="name"], .field[data-key$=".place"] {
    font-variant-caps: small-caps;
    letter-spacing: .015em;
  }
  /* An address has no first word to enlarge, so it gets the small capital at
     every position instead: same face, same size throughout, no initial.
     Safari has supported all-small-caps since iOS 9.3 as well. */
  .field[data-key="email"] {
    font-variant-caps: all-small-caps;
    letter-spacing: .015em;
  }
  .k[data-ch] { text-transform: uppercase; }
  .field .placeholder { color: #5C628A; text-transform: none; }
  .caret {
    display: inline-block; width: 3px; height: 1.3em;
    background: var(--focus); margin-left: 2px;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }

  .drop {
    flex: none; font-family: inherit; cursor: pointer;
    border: 2px solid transparent; border-radius: 14px;
    background: none; color: var(--muted);
    font-size: 1.5rem; line-height: 1; padding: .3rem .45rem;
  }
  .drop:active { color: #A02216; background: var(--tint); }

  /* Narrow on purpose while it shares a row: the town beside it is where the
     work happens, so the button asks for about a seventh of the width and
     lets the town have the rest. It stops shrinking at 9.5rem, which is still
     a comfortable target, and below that the flex basis can no longer be met
     and it wraps to its own line exactly as before. */
  /* Narrow on purpose while it shares a row. The town beside it is where the
     work happens, so the button asks for about an eighth of the width and
     leaves the rest to the town.

     The label wraps rather than holding the button open: with the words on
     one line the narrowest this could ever be was the width of that line.
     Wrapping drops the floor to the longest single word, which is what lets
     the eighth actually be reached. Note 1rem is 20px here, not 16px. */
  .addbtn {
    flex: 1 1 12rem; min-width: 0; max-width: 30rem;
    align-self: stretch;
    font-family: inherit; cursor: pointer; border-radius: 17px;
    border: 2px dashed var(--add); background: var(--add-bg); color: var(--add);
    font-weight: 700; font-size: 1.04rem; padding: .8rem .7rem;
    display: flex; flex-wrap: wrap; align-items: center;
    align-content: center; justify-content: center;
    column-gap: .4rem; row-gap: .1rem; line-height: 1.2;
  }
  /* Narrow only while it shares a row with a town. Alone on its own row it
     goes back to full width, where the label fits on one line and the button
     is a single row tall: kept narrow there it wrapped to three lines and
     cost 65px of height, which is what pushed two towns into scrolling. */
  .addbtn.inline { flex: 0 1 14%; min-width: 8rem; }
  .addbtn .albl { text-align: center; }
  .addbtn .plus { font-size: 1.35rem; line-height: 1; font-weight: 500; }
  .addbtn:active { background: var(--add); color: #fff; border-style: solid; }

  /* ---------- suggestion dropdown ---------- */
  #drop {
    /* Above the Submit bar, never over the keyboard: typing continues while
           the list is open. */
    position: fixed; z-index: 55; display: none;
    background: var(--panel);
    border: 2px solid var(--focus); border-radius: 16px;
    box-shadow: 0 10px 28px rgba(16,23,58,.28);
    overflow-y: auto; max-height: 42vh;
  }
  #drop.show { display: block; }
  .opt {
    display: flex; align-items: center; justify-content: space-between;
    gap: .8rem; width: 100%; text-align: left;
    padding: .62rem 1rem; font: inherit; font-size: 1.05rem;
    background: none; border: none; border-bottom: 1px solid #D9DCE8;
    color: var(--ink); cursor: pointer;
  }
  .opt:last-child { border-bottom: none; }
  /* A quiet label so the list reads as an offer rather than as something that
     happened to the field. Sticky, so it stays put if the list scrolls. */
  .dhead {
    position: sticky; top: 0; z-index: 1;
    font-size: .72rem; font-style: italic; color: var(--muted);
    background: var(--tint); border-bottom: 1px solid var(--edge-lt);
    padding: .22rem .7rem; letter-spacing: .02em;
  }
  .opt > span:first-child {
    font-variant-caps: small-caps;
    letter-spacing: .015em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .opt:active, .opt.sel { background: var(--focus); color: #fff; }
  .opt.looking { color: var(--muted); font-size: .9rem; font-style: italic;
                 cursor: default; }
  .opt .mi.lit { background: #E4E6F2; color: var(--muted); }
  .opt.sel .mi, .opt:active .mi { background: rgba(255,255,255,.28); color: #fff; }
  .opt:active .mi { background: rgba(255,255,255,.28); color: #fff; }
  .opt .mi {
    flex: none; font-size: .82rem; padding: .2rem .55rem; border-radius: 20px;
    font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .opt .mi.near { background: var(--tint); color: var(--sea); }
  .opt .mi.far  { background: var(--focusbg); color: var(--focus); }

  /* ---------- action bar ---------- */
  .actionbar {
    flex: none; padding: .5rem 1.3rem;
    background: var(--paper); border-top: 2px solid var(--edge-lt);
  }
  /* The one thing on the page to press, so it is styled unlike anything else:
     its own accent colour, a heavy border, capitals and wide letter-spacing.
     The drop shadow sits directly under the border and collapses on press, so
     the button physically goes down under the finger. */
  .done {
    width: 100%; background: var(--go); color: var(--go-ink);
    border: 2px solid var(--go-edge); border-radius: 19px;
    font-family: inherit; font-size: 1.5rem; font-weight: 800;
    letter-spacing: .01em;
    padding: .82rem; cursor: pointer;
    box-shadow: 0 4px 0 var(--go-edge);
  }
  /* Sits above the button, quiet, so nobody feels stuck waiting to finish. */
  .gonote {
    font-size: .95rem; color: var(--muted); text-align: center;
    margin: 0 0 .38rem; line-height: 1.3;
  }
  .done:active { transform: translateY(4px); box-shadow: none; }

  /* ---------- keyboard ---------- */
  .kbwrap { flex: none; background: #EFE7EC; border-top: 2px solid var(--keyedge);
            min-height: 286px; }
  .kb { padding: .35rem .7rem .45rem;
        padding-bottom: calc(.55rem + env(safe-area-inset-bottom, 0px));
        padding-left:  calc(.7rem + env(safe-area-inset-left, 0px));
        padding-right: calc(.7rem + env(safe-area-inset-right, 0px)); }
  .krow { display: flex; gap: .36rem; margin-bottom: .3rem; justify-content: center; }
  .krow:last-child { margin-bottom: 0; }
  .k {
    flex: 1 1 0; min-width: 0;
    background: var(--key); border: 2px solid var(--keyedge);
    border-radius: 12px; height: 50px;
    font-size: 1.15rem; font-family: inherit; font-weight: 500; color: var(--keyink);
    cursor: pointer; box-shadow: 0 2px 0 rgba(16,23,58,.25);
  }
  /* Press state is driven from JS rather than :active. Two reasons: :active
       on iOS only fires reliably with a touch listener registered, and
       `.digits .k` and `.k.dim` carry the same specificity as `.k:active`
       while coming later in the file, so they won and the number row never
       lit up. `.kb .k.pressed` outranks both, and JS holds it long enough to
       be seen on a fast tap. */
  .kb .k.pressed {
    background: var(--focus); color: #fff; border-color: var(--focus);
    transform: translateY(2px); box-shadow: none;
  }
  .k.wide { flex: 1.7 1 0; font-size: .9rem; }
  .k.space { flex: 5 1 0; }
  .k.dim { background: var(--keyface); }
  /* Digits get their own full-width row, larger and heavier. They are the
       keys people hunt for and they are read at arm's length. */
  .digits { margin-bottom: .5rem; }
  .digits .k {
    height: 56px; font-size: 1.5rem; font-weight: 700;
    background: #F2F4FB; border-color: var(--edge);
  }

  /* ---------- thank you ---------- */
  #thanks {
    position: fixed; inset: 0; background: var(--ink); color: #fff;
    display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 2rem; z-index: 50;
  }
  #thanks.show { display: flex; }
  #thanks h1 { font-family: var(--serif); font-size: 3.1rem;
               margin: 0 0 .5rem; font-weight: 600; letter-spacing: .01em; }
  #thanks p { font-family: var(--serif); font-size: 1.32rem;
              opacity: .92; margin: 0; }


  /* Short viewports. iPad landscape is 768px tall, and five keyboard rows
       plus the action bar leave little for the form. Spacing tightens rather
       than the layout reflowing, so it still reads the same; only whitespace
       goes. */

  /* Any of these on the page would let iOS raise its own keyboard over ours.
       Suppressed here so a later edit can't reintroduce it silently. */
  /* No text-entry element may exist inside the kiosk, or iOS raises its own
       keyboard over ours. The review screen sits outside #app and keeps real
       inputs, because its date fields want the system picker. */
  #app input, #app textarea, #app select, #app [contenteditable] {
    display: none !important;
  }

  .jswarn {
    background: #FDF4E0; border: 2px solid #A86A00; color: #4A2140;
    border-radius: 16px; padding: 1rem 1.2rem; margin: 1.2rem;
    font-size: 1rem; line-height: 1.45;
  }
  .jswarn b { display: block; margin-bottom: .3rem; }

  @media (max-height: 830px) {
    header {
      padding: .3rem 1.1rem;
      padding-top: calc(.3rem + env(safe-area-inset-top, 0px));
      padding-left: calc(1.1rem + env(safe-area-inset-left, 0px));
      padding-right: calc(1.1rem + env(safe-area-inset-right, 0px));
    }
    .peek, .refresh { padding: .14rem .6rem; }
    .logo { height: 28px; }
    .refresh .lbl { font-size: .66rem; }
    .peek-date { font-size: .76rem; }
    .peek-cta { font-size: .7rem; }
    main { padding: .4rem 1.1rem .42rem; }
    .identity { margin-bottom: .22rem; }
    .quiet-label { font-size: .98rem; margin-bottom: .1rem; }
    .field.small { min-height: 40px; }
    h2 { font-size: 1.16rem; }
    .field { min-height: 46px; font-size: 1.04rem; }
    .field.num { min-height: 40px; font-size: 1.12rem; }
    .numcell > span { font-size: .98rem; }
    .numcell { gap: .1rem; }
    .step { flex: 0 0 2.1rem; font-size: 1.3rem; }
    .stepper.small .step { flex: 0 0 2rem; }
    .town { padding: .28rem .42rem .3rem; }
    .nums { margin-top: .22rem; gap: .4rem; }
    .addbtn { padding: .5rem .8rem; font-size: 1.04rem; }
    .actionbar { padding: .24rem 1.1rem; }
    .done { padding: .5rem; font-size: 1.3rem; }
    .gonote { font-size: .84rem; margin-bottom: .14rem; }
    .kb { padding: .25rem .6rem .3rem; }
    .krow { gap: .28rem; margin-bottom: .25rem; }
    .k { height: 42px; font-size: 1.04rem; }
    .digits { margin-bottom: .34rem; }
    .digits .k { height: 46px; font-size: 1.3rem; }
    /* the reserved floor must shrink too, or it props the keyboard open */
    .kbwrap { min-height: 240px; }
  }


  /* ---------- review overlay ---------- */
  #review {
    position: fixed; inset: 0; background: var(--paper); z-index: 60;
    display: none; flex-direction: column;
  }
  #review.show { display: flex; }
  #review > header { flex: none; }
  #review .rbody {
    flex: 1 1 auto; overflow-y: auto; padding: 1.3rem;
    padding-bottom: calc(1.3rem + env(safe-area-inset-bottom, 0px));
    padding-left:   calc(1.3rem + env(safe-area-inset-left, 0px));
    padding-right:  calc(1.3rem + env(safe-area-inset-right, 0px));
  }
  #review .inner { max-width: 1000px; margin: 0 auto; }
  #review .wordmark { font-family: var(--serif); font-size: 1.14rem; }
  #review .rbtns { display: flex; gap: .6rem; }
  #review .rbtns button {
    color: #fff; font: inherit; font-size: .9rem; background: none;
    border: 1px solid rgba(255,255,255,.45); border-radius: 7px;
    padding: .4rem .95rem; cursor: pointer;
  }
  .rangebar {
    display: flex; flex-wrap: wrap; gap: .8rem 1.4rem; align-items: center;
    padding: .7rem .9rem; margin-bottom: 1.1rem;
    background: #fff; border: 1px solid var(--edge); border-radius: 10px;
  }
  .rgrp { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
  .rgrp label { font-size: .82rem; color: var(--muted); font-weight: 600; }
  .rangebar input[type="date"] {
    font: inherit; font-size: .92rem; padding: .35rem .5rem;
    border: 2px solid var(--edge); border-radius: 7px; color: var(--ink);
    background: #fff;
  }
  .rbtn {
    font: inherit; font-size: .86rem; font-weight: 600;
    padding: .4rem .8rem; border-radius: 7px; cursor: pointer;
    border: 2px solid var(--edge); background: #fff; color: var(--ink);
  }
  .rbtn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .rbtn:active { background: var(--focusbg); }
  .rgrp.themes { margin-left: auto; }
  .tlabel { font-size: .82rem; color: var(--muted); font-weight: 600; }
  .rangenote { font-size: .86rem; color: var(--muted); margin-bottom: .9rem; }

  table.tally {
    width: 100%; border-collapse: collapse; background: #fff;
    border: 2px solid var(--ink); margin-bottom: 1.3rem;
    font-variant-numeric: tabular-nums;
  }
  .tally th, .tally td {
    border: 1px solid #CDB2C1; padding: .5rem .4rem; text-align: center;
    font-size: .95rem;
  }
  .tally th {
    font-size: .78rem; font-weight: 700; line-height: 1.2;
    background: #F7E9F1; vertical-align: bottom;
  }
  .tally th em {
    display: block; font-style: normal; font-weight: 600;
    color: var(--indigo); font-size: .72rem; margin-top: .15rem;
  }
  .tally td { font-size: 1.05rem; }
  .tally td.day, .tally th:first-child { text-align: left; white-space: nowrap;
                                         font-size: .88rem; }
  .tally tr.latest td { background: #FBEBF2; font-weight: 700; }
  .tally tr.wk td { font-weight: 700; background: #F5E6EE;
                    border-top: 1px solid var(--ink); }
  .tally tr.wk td.day { color: var(--indigo); }
  .tally tr.gap td { height: .5rem; padding: 0; border-left: none;
                     border-right: none; background: var(--paper); }
  .tally td.day em { font-style: normal; color: var(--accent); font-size: .78rem;
                     font-weight: 700; }
  .tally tr.grand td { font-weight: 700; border-top: 2px solid var(--ink);
                       background: #FBEEF4; font-size: 1.15rem; }
  .rsub { font-size: 1rem; font-weight: 700; margin: 1.6rem 0 .6rem; }
  .rnote { font-weight: 400; color: var(--muted); font-size: .85rem; }
  .storeline { font-size: .84rem; color: var(--muted); margin-bottom: 1rem; }
  .storeline .bar {
    height: 7px; background: #E9D6E1; border-radius: 4px;
    overflow: hidden; margin-bottom: .35rem;
  }
  .storeline .bar i { display: block; height: 100%; background: var(--sea); }
  .tot { background:#fff; border:1px solid var(--edge); border-radius:10px;
         padding:.75rem .9rem; }
  .tot .n { font-size:1.85rem; font-weight:650; line-height:1.1;
            font-variant-numeric:tabular-nums; }
  .tot .l { font-size:.78rem; color:var(--muted); line-height:1.3; margin-top:.25rem; }
  .tot .l b { display:block; color:var(--indigo); font-weight:600; }
  .note { background:#FDF4E0; border:1px solid #C79415; border-radius:8px;
          padding:.75rem 1rem; font-size:.88rem; margin-bottom:1.3rem; }
  .visit { background:#fff; border:1px solid var(--edge); border-radius:10px;
           padding:.7rem .9rem; margin-bottom:.65rem; }
  /* The whole header is the toggle, so the target is the full width of the
     card rather than a small chevron. */
  .vhead { display:flex; gap:.8rem; align-items:baseline; flex-wrap:wrap;
           width:100%; text-align:left; background:none; border:none;
           font:inherit; cursor:pointer; padding:0;}
  .vhead .who { color:var(--ink); font-weight:600; font-size:.96rem; }
  .vhead .anon { color:var(--muted); font-weight:400; font-style:italic; }
  .r { display:flex; flex-wrap:wrap; gap:.45rem; row-gap:.3rem;
       align-items:center; border-left:4px solid #C0A3B2; background:#FAF3F7;
       border-radius:6px; padding:.45rem .7rem; margin-bottom:.32rem;
       font-size:.9rem; }
  .r.usable { border-left-color:#0F7268; background:#E9F3F0; }
  .r.review { border-left-color:#C79415; background:#FDF4E0; }
  .r .what { flex:1 1 14rem; min-width:0; }
  .r .raw { color:var(--muted); font-size:.79rem; }
  .r .pill { font-size:.74rem; padding:.15rem .5rem; border-radius:20px;
             background:rgba(27,35,80,.09); white-space:nowrap;
             font-variant-numeric:tabular-nums; }
  .r .pill.yes { background:#D8E7E3; color:#0B5A52; }
  .vchev { color:var(--accent); font-size:.8rem; display:inline-block;
           transition:transform .12s ease; }
  .vhead[aria-expanded="true"] .vchev { transform:rotate(90deg); }
  .vhead:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  .vdetail { margin-top:.5rem; border-top:1px dashed var(--edge-lt); padding-top:.5rem; }
  .vdetail[hidden] { display:none; }
  .vblock { margin-bottom:.55rem; }
  .vblock:last-child { margin-bottom:0; }
  .vbh { font-size:.8rem; font-weight:700; color:var(--accent);
         text-transform:uppercase; letter-spacing:.05em; margin-bottom:.2rem; }
  .vrow { display:flex; justify-content:space-between; gap:1rem;
          font-size:.82rem; padding:.16rem 0; border-bottom:1px solid var(--tint); }
  .vrow:last-child { border-bottom:none; }
  .vrow > span:first-child { color:var(--muted); }
  .vrow > span:last-child { color:var(--ink); font-weight:600; text-align:right; }
  /* Deliberately plain until pressed. It sits inside the panel, so a card has
     to be opened before it can be reached at all. */
  .vdel { margin-top:.6rem; }
  .delbtn {
    font:inherit; font-size:.82rem; font-weight:600; cursor:pointer;
    color:#8C1D1D; background:#fff; border:2px solid #8C1D1D;
    border-radius:8px; padding:.35rem .8rem;
  }
  .delbtn:active { background:#8C1D1D; color:#fff; }
  .delbtn:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  .rempty { text-align:center; color:var(--muted); padding:3rem 1rem; }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
</style>
</head>

let state = { name: "", email: "", member: false, rows: [] };
let focusKey = null;
/* Number fields arrive pre-filled (1 person, 0 nights). The first digit
   replaces that rather than appending, or tapping the people box and
   pressing 3 gives 13. Digits after the first append, so 12 still works. */
let replaceNext = false;
let dropIndex = -1;   // highlighted suggestion, for arrow keys

function blankRow() {
  return { place: "", count: "1", paid_nights: "0", free_nights: "0" };
}

/* ---------- rendering ---------- */

/* Hard limits. Each is a way the page could otherwise be wedged: a number
   too large to read, a place name that blows out the layout and the storage,
   or an unbounded list of towns. */
const MAX_NUM  = 999;
const MAX_ROWS = 12;
const MAX_TEXT = { name: 60, email: 80, place: 80 };

function capFor(key) {
  if (key === "name" || key === "email") return MAX_TEXT[key];
  return MAX_TEXT.place;
}

function numCell(key, label) {
  return '<div class="numcell"><span>' + label + '</span>' +
    '<div class="stepper">' +
      '<button class="step" data-step="-1" data-target="' + key + '" ' +
        'aria-label="one fewer">&minus;</button>' +
      '<div class="field num" data-key="' + key + '"></div>' +
      '<button class="step" data-step="1" data-target="' + key + '" ' +
        'aria-label="one more">+</button>' +
    '</div></div>';
}

/* Step a number. Clamped at both ends: holding + can't run away, holding -
   can't go negative. */
function bump(key, delta) {
  const cur = parseInt(valueOf(key), 10) || 0;
  setValue(key, String(Math.max(0, Math.min(MAX_NUM, cur + delta))));
  focusKey = key;
  replaceNext = true;
  paint();
}

/* One self-contained block per town, flowing two across. "Add another town"
   appends a block, so they fill right, then next row left. Below 760px the
   grid collapses to a single column, which is what a portrait phone or a
   split-screen iPad gets. */
function renderRows() {
  const host = document.getElementById("rows");
  host.innerHTML = "";

  state.rows.forEach((row, i) => {
    const el = document.createElement("div");
    el.className = "town";
    el.innerHTML =
      '<div class="town-top">' +
        '<div class="field" data-key="' + i + '.place"></div>' +
        (state.rows.length > 1
          ? '<button class="drop" data-drop="' + i + '" title="Remove this town">&times;</button>'
          : "") +
      '</div>' +
      '<div class="nums">' +
        numCell(i + ".count",       "How many people from this place?") +
        numCell(i + ".paid_nights", "Nights in paid lodging") +
        numCell(i + ".free_nights", "Nights with friends/family") +
      '</div>';
    host.appendChild(el);
  });

  if (state.rows.length < MAX_ROWS) {
    const add = document.createElement("button");
    add.className = "addbtn"; add.id = "addrow";
    add.innerHTML = '<span class="plus">+</span>' +
                    '<span class="albl">Add another town</span>';
    host.appendChild(add);
  }

  paint();
}

const TOP_FIELDS = ["name", "email"];

function valueOf(key) {
  if (TOP_FIELDS.includes(key)) return state[key];
  const [i, field] = key.split(".");
  return state.rows[+i][field];
}

function setValue(key, val) {
  if (TOP_FIELDS.includes(key)) { state[key] = val; return; }
  const [i, field] = key.split(".");
  state.rows[+i][field] = val;
}

function isNumeric(key) {
  return key && key.includes(".") && !key.endsWith(".place");
}

function paintMember() {
  const b = document.getElementById("memberbtn");
  if (b) b.setAttribute("aria-pressed", state.member ? "true" : "false");
}

function paint() {
  paintMember();
  document.querySelectorAll("[data-key]").forEach(el => {
    const key = el.dataset.key;
    const val = valueOf(key);
    const active = key === focusKey;
    el.classList.toggle("active", active);
    if (val === "" && !active) {
      const hint = key.endsWith(".place") ? "Town, State" : "";
      el.innerHTML = hint ? '<span class="placeholder">' + hint + "</span>" : "";
    } else {
      el.textContent = val;
      if (active) el.insertAdjacentHTML("beforeend", '<span class="caret"></span>');
    }
    if (active) {
      requestAnimationFrame(() =>
        el.scrollIntoView({ block: "nearest", behavior: "smooth" }));
    }
  });
  document.querySelectorAll("[data-step]").forEach(b =>
    b.classList.toggle("on", b.dataset.target === focusKey));
  fitAddButton();
  renderDrop();
}

/* Is the add button sharing a row with a town, or sitting on its own? Measured
   rather than guessed, because the answer depends on the town count, the
   screen width and the clamp in .town all at once. Checked with the narrow
   style off, so the measurement reflects the widest the button would be; if it
   still shares the row at that width it will certainly share it once narrowed. */
function fitAddButton() {
  const add = document.getElementById("addrow");
  if (!add) return;
  add.classList.remove("inline");
  const towns = document.querySelectorAll(".town");
  const last = towns[towns.length - 1];
  if (!last) return;
  if (Math.abs(add.getBoundingClientRect().top -
               last.getBoundingClientRect().top) < 4) {
    add.classList.add("inline");
  }
}

/* ---------- matching ---------- */

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      const c = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c);
    }
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}

/* Match quality, higher is better. Same scoring as 50PlusMilesFromFHCalculator. */
/* "friday harbor" -> "fh". Only built for names of two or more words. */
function initialsOf(b) {
  const w = b.split(/[\s.'-]+/).filter(Boolean);
  return w.length > 1 ? w.map(x => x[0]).join("") : "";
}

function score(input, name) {
  const a = input.toLowerCase().trim(), b = (name || "").toLowerCase().trim();
  if (!a) return 0;
  if (a === b) return 1.25;
  if (b.startsWith(a)) return 1;
  if (a.startsWith(b)) return 0.92;
  if (b.includes(a)) return 0.8;
  // Initials, for the shorthand locals use: FH, MV, LA. Scored below every
  // literal match above, so typing "la" still puts Lacey and Lakewood first
  // and Los Angeles joins the list rather than taking it over.
  if (a.length >= 2 && a.length <= 4 && a === initialsOf(b)) return 0.78;
  return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
}

const R_MI = 3958.7613;
function milesFromFH(lat, lon) {
  const rad = d => d * Math.PI / 180, o = PLACES.origin;
  const dLat = rad(lat - o.lat), dLon = rad(lon - o.lon);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(rad(o.lat)) * Math.cos(rad(lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R_MI * Math.asin(Math.sqrt(a));
}

const PROV = { "British Columbia":"BC", "Alberta":"AB", "Ontario":"ON",
  "Quebec":"QC", "Manitoba":"MB", "Nova Scotia":"NS", "Saskatchewan":"SK",
  "New Brunswick":"NB", "Yukon":"YT" };

function labelOf(r) {
  const name = r.name, admin = r.admin1, cc = r.country;
  // Where the region repeats the name (Ljubljana, Ljubljana) the country
  // would drop out entirely, so fall back to it.
  if (!admin || name === admin) {
    if (cc === "CA") return name + ", Canada";
    if (r.countryName && r.countryName !== name) return name + ", " + r.countryName;
    return name;
  }
  if (cc === "CA") return name + ", " + (PROV[admin] || admin) + ", Canada";
  if (cc === "US" || !cc) return name + ", " + admin;
  // Geocoder rows carry the full country name; prefer it over the code.
  return name + ", " + admin + ", " + (r.countryName || cc);
}

/* "Paris, France" -> head "Paris", tail "france". The tail boosts any row
   whose state or country contains it, so naming the country after the city
   pulls the right one up. */
function splitQuery(s) {
  const p = String(s).split(",");
  return { head: p[0].trim(), tail: p.slice(1).join(" ").trim().toLowerCase() };
}

function regionBonus(r, tail) {
  if (!tail) return 0;
  const reg = [r.admin1, r.country, r.countryName].filter(Boolean)
                .join(" ").toLowerCase();
  if (!reg) return 0;
  return tail.split(/[\s,]+/).some(w => w.length > 1 && reg.includes(w)) ? 0.15 : 0;
}

const rowKey = r => [r.name, r.admin1 || r.country].join("|").toLowerCase();

/* With nothing typed yet, offer the closest places first. Almost everyone who
   signs in from the islands is in this list, and they can tap rather than
   spell. Built once at load, since it never changes. */
function townRow(t) {
  return { name: t[0], latitude: t[1], longitude: t[2],
           admin1: t[3], country: t[4], _local: true, _s: 0 };
}

/* Every bundled town that has coordinates, nearest first. */
let BY_DISTANCE = null;
function byDistance() {
  if (!BY_DISTANCE) {
    BY_DISTANCE = PLACES.towns.filter(t => t[1] != null).map(townRow)
      .sort((a, b) => milesFromFH(a.latitude, a.longitude) -
                      milesFromFH(b.latitude, b.longitude));
  }
  return BY_DISTANCE;
}

/* Friday Harbor is the origin, so it sorts first at 0 mi with no special
   casing. */
let NEARBY = null;
function nearbySuggest() {
  if (!NEARBY) NEARBY = byDistance().slice(0, LIST_MAX);
  return NEARBY;
}

/* One letter is not enough for the fuzzy matcher, but it is plenty to filter
   by: the towns that start with it, nearest first. */
function nearStartingWith(ch) {
  const c = ch.toLowerCase();
  return byDistance().filter(r => r.name.toLowerCase().startsWith(c))
                     .slice(0, LIST_MAX);
}

/* LOCAL: the bundled towns, states, provinces and countries. Instant, works
   offline, tolerates typos anywhere in the word. */
function localSuggest(input) {
  const { head, tail } = splitQuery(input);
  if (head.length < 2) return [];
  const out = [];
  for (const t of PLACES.towns) {
    const r = { name: t[0], latitude: t[1], longitude: t[2],
                admin1: t[3], country: t[4], _local: true };
    r._s = score(head, t[0]) + regionBonus(r, tail);
    if (r._s >= 0.5) out.push(r);
  }
  for (const [display, aliases] of PLACES.countries) {
    let best = 0;
    for (const a of aliases) best = Math.max(best, score(head, a));
    if (best >= 0.5) {
      out.push({ name: display, admin1: "", country: "", countryName: display,
                 latitude: null, longitude: null, _local: true, _s: best });
    }
  }
  return out.sort((a, b) => b._s - a._s).slice(0, 8);
}

/* ONLINE: everywhere else, via Open-Meteo. Queried every time rather than
   held back as a fallback, so Chengdu and Ljubljana get real matches. With
   no network it returns nothing and the local list stands. */
async function geocode(name, count, signal) {
  const url = "https://geocoding-api.open-meteo.com/v1/search?name=" +
    encodeURIComponent(name) + "&count=" + (count || 10) +
    "&language=en&format=json";
  const res = await fetch(url, { signal });
  if (!res.ok) throw new Error("lookup");
  return (await res.json()).results || [];
}

async function onlineSuggest(input, signal) {
  const { head, tail } = splitQuery(input);
  if (head.length < 2) return [];
  const direct = await geocode(head, 10, signal);
  let pool = direct.slice();
  if (direct.length < 5 && head.length >= 3) {
    try {
      const pre = await geocode(head.slice(0, 3), 10, signal);
      const seen = new Set(pool.map(r => r.id));
      pre.forEach(r => { if (!seen.has(r.id)) { seen.add(r.id); pool.push(r); } });
    } catch (e) {}
  }
  return pool.map(r => {
    r._local = false;
    r.countryName = r.country;
    r.country = r.country_code || r.country;
    r._s = score(head, r.name) + regionBonus(r, tail);
    return r;
  }).filter(r => r._s >= 0.34).sort((a, b) => b._s - a._s).slice(0, 8);
}

/* Merge.

   The list paints from local data immediately, then repaints when the
   geocoder answers ~300ms later. If that repaint reorders things, the row
   someone is reaching for moves out from under their finger. Two rules
   prevent it:

   1. A local match beats an online match of equal textual quality by a clear
      margin, not a hair. Visitors come from Washington, BC and the larger US
      cities far more often than from their foreign namesakes, and those are
      what the local list holds. A better online match still wins:
      "Chengdu" beats "Cheney" because an exact match outscores a fuzzy one
      by more than the bonus.

   2. Local rows already on screen stay on screen. A better online match can
      push them down, never off. */
const LOCAL_BONUS = 0.15;   // clear margin over an online tie
const PIN_MIN     = 0.8;    // only pin local rows that actually match
const KEEP_LOCAL  = 4;
const LIST_MAX    = 8;

function mergeSuggest(local, online) {
  const w = r => r._s + (r._local ? LOCAL_BONUS : 0);
  const d = r => (r.latitude == null ? 1e7 : milesFromFH(r.latitude, r.longitude));
  const cmp = (a, b) =>
    Math.abs(w(a) - w(b)) < 0.001 ? d(a) - d(b) : w(b) - w(a);

  // Strong local matches claim slots first, so a flood of online results can't
  // push them off. Weak fuzzy matches aren't pinned, which is why "Chengdu"
  // isn't crowded out by "Cheney".
  const pinned = local.filter(r => r._s >= PIN_MIN).slice(0, KEEP_LOCAL);
  const claimed = new Set(pinned.map(rowKey));

  const rest = [];
  local.concat(online).forEach(r => {
    const k = rowKey(r);
    if (claimed.has(k)) return;
    claimed.add(k);
    rest.push(r);
  });

  // Pinning guarantees presence, not position; the final sort can still put a
  // better online match above a pinned local one.
  return pinned.concat(rest.sort(cmp)).slice(0, LIST_MAX).sort(cmp);
}

/* ---------- dropdown, anchored under the focused field ----------

   Local results paint immediately so the list never feels laggy. The online
   lookup is debounced and merged in when it lands, and only if the query
   hasn't changed since. */

/* Coordinates for geocoder picks, kept so a place outside the bundled list
   still resolves months later, offline, when the tally runs. Stored
   alongside the sign-in. */
const CACHE_KEY = "sjima.places.v1";
let PLACE_CACHE = {};
try { PLACE_CACHE = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}") || {}; }
catch (e) { PLACE_CACHE = {}; }

function rememberPlace(label, info) {
  PLACE_CACHE[label.toLowerCase()] = info;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(PLACE_CACHE)); } catch (e) {}
}

let dropRows = [];
let lookupSeq = 0;
let lookupTimer = null;
let lookupCtl = null;

/* The list is never empty. If nothing matches at all, offer what was typed
   verbatim, so a town that is in no database can still be entered. */
function withFallback(rows, query) {
  const q = query.trim();
  if (!q || rows.length) return rows;
  return [{ name: q, admin1: "", country: "", latitude: null, longitude: null,
            _local: true, _s: 0, _literal: true }];
}

function paintDrop(rows, pending) {
  const box = document.getElementById("drop");
  dropRows = rows;
  if (!rows.length && !pending) { box.classList.remove("show"); return; }
  if (dropIndex >= rows.length) dropIndex = rows.length - 1;

  box.innerHTML = '<div class="dhead">Suggestions:</div>' + rows.map((r, i) => {
    const label = r._literal ? r.name : labelOf(r);
    let tag = "";
    if (r._literal) tag = '<span class="mi lit">use as typed</span>';
    else if (r.latitude != null) {
      const mi = milesFromFH(r.latitude, r.longitude);
      tag = '<span class="mi ' + (mi >= PLACES.radius ? "far" : "near") + '">' +
            Math.floor(mi) + " mi</span>";
    }
    return '<button class="opt' + (i === dropIndex ? " sel" : "") +
           '" data-pick="' + i + '"><span>' + label + "</span>" + tag + "</button>";
  }).join("") + (pending ? '<div class="opt looking">searching worldwide\u2026</div>' : "");

  const field = document.querySelector('[data-key="' + focusKey + '"]');
  if (!field) { box.classList.remove("show"); return; }
  const r = field.getBoundingClientRect();
  const kbTop = document.querySelector(".kbwrap").getBoundingClientRect().top;
  box.style.left = r.left + "px";
  box.style.width = Math.max(r.width, 340) + "px";
  box.style.top = (r.bottom + 4) + "px";
  box.style.maxHeight = Math.max(140, kbTop - r.bottom - 12) + "px";
  box.classList.add("show");
}

function renderDrop() {
  const box = document.getElementById("drop");
  if (!focusKey || !focusKey.endsWith(".place")) {
    box.classList.remove("show");
    if (lookupTimer) { clearTimeout(lookupTimer); lookupTimer = null; }
    return;
  }

  const query = valueOf(focusKey);
  const seq = ++lookupSeq;

  if (lookupTimer) { clearTimeout(lookupTimer); lookupTimer = null; }
  if (lookupCtl) { try { lookupCtl.abort(); } catch (e) {} }

  // Nothing typed: the nearest places, closest first. No lookup to make.
  const q = query.trim();
  if (!q) { paintDrop(nearbySuggest(), false); return; }
  if (q.length === 1) {
    paintDrop(withFallback(nearStartingWith(q), query), false);
    return;
  }

  const local = localSuggest(query);
  const searching = query.trim().length >= 2;
  paintDrop(withFallback(local, query), searching);
  if (!searching) return;

  lookupTimer = setTimeout(async () => {
    lookupCtl = new AbortController();
    let online = [];
    try { online = await onlineSuggest(query, lookupCtl.signal); }
    catch (e) { online = []; }                 // offline: the local list stands
    if (seq !== lookupSeq) return;             // query changed since
    if (!focusKey || valueOf(focusKey) !== query) return;
    paintDrop(withFallback(mergeSuggest(local, online), query), false);
  }, 260);
}

/* ---------- input ---------- */

function type(ch) {
  if (!focusKey) return;
  if (isNumeric(focusKey)) {
    if (!/[0-9]/.test(ch)) return;
    let v = replaceNext ? "" : valueOf(focusKey);
    replaceNext = false;
    if (v === "0") v = "";
    if (v.length >= 3) return;
    setValue(focusKey, v + ch);
  } else {
    // Auto-capitalise names and places: the on-screen keyboard has no shift
    // key, so without this everything lands lowercase. Email is left as typed.
    const cur = valueOf(focusKey);
    if (cur.length >= capFor(focusKey)) return;
    const capitalise = focusKey !== "email" &&
      (cur === "" || /[\s\-'.]$/.test(cur));
    setValue(focusKey, cur + (capitalise ? ch.toUpperCase() : ch));
  }
  dropIndex = -1;
  paint();
}

function backspace() {
  if (!focusKey) return;
  replaceNext = false;
  setValue(focusKey, valueOf(focusKey).slice(0, -1));
  paint();
}

function clearField() {
  if (!focusKey) return;
  replaceNext = false;
  setValue(focusKey, isNumeric(focusKey) ? "0" : "");
  paint();
}

/* Tap away to dismiss.

   Tapping a blank part of the page closes the suggestion list and lets the
   field go, the way it does in any touch app. Everything that has a job of
   its own is excluded: the list, the keyboard, the fields, the steppers, the
   add and member buttons, the header and the review screen. So picking a
   suggestion, typing, and moving between fields all behave exactly as before,
   and only a tap on nothing in particular dismisses.

   Nothing typed is lost. The value lives in state, not in the field, so the
   text is still there when the field is tapped again. */
const KEEPS_FOCUS = "#drop, .kbwrap, [data-key], [data-step], [data-ch], " +
                    "[data-num], [data-act], [data-pick], [data-drop], " +
                    "#addrow, .memberbtn, #review, header, .done";

document.addEventListener("pointerdown", ev => {
  if (!focusKey) return;
  const t = ev.target;
  if (t && t.closest && t.closest(KEEPS_FOCUS)) return;
  focusKey = null;
  dropIndex = -1;
  paint();
}, { capture: true, passive: true });

/* iOS keyboard guard.

   Nothing on this page is a text-entry element, so iOS should never raise a
   keyboard. If one does appear (a stray element, a later edit, a keyboard
   left floating by another app), blurring the focused element dismisses it.
   Our own buttons are exempt so they still work. */
document.addEventListener("focusin", ev => {
  const t = ev.target;
  // The review screen is allowed real inputs; the kiosk is not.
  if (t && t.closest && t.closest("#review")) return;
  if (t && t.tagName && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) t.blur();
  if (t && t.isContentEditable) t.blur();
}, true);

/* A tap can be shorter than the eye catches, so hold the press state for a
   minimum time rather than releasing it with the finger. */
const PRESS_MS = 110;
function pressKey(el) {
  if (!el || !el.classList.contains("k")) return;
  el.classList.add("pressed");
  clearTimeout(el._pressT);
  el._pressT = setTimeout(() => el.classList.remove("pressed"), PRESS_MS);
}
document.addEventListener("pointerdown", ev => {
  const k = ev.target.closest(".k");
  if (k) pressKey(k);
}, { passive: true });

document.querySelectorAll(".krow[data-keys]").forEach(rowEl => {
  rowEl.dataset.keys.split(" ").forEach(ch => {
    const b = document.createElement("button");
    b.className = "k"; b.textContent = ch; b.dataset.ch = ch;
    rowEl.appendChild(b);
  });
});

document.body.addEventListener("click", ev => {
  const t = ev.target.closest(
    "[data-step],[data-key],[data-ch],[data-num],[data-act],[data-pick]," +
    "[data-drop],#addrow");
  if (!t) return;

  if (t.id === "addrow") {
    click("key");
    if (state.rows.length >= MAX_ROWS) return;
    state.rows.push(blankRow());
    renderRows();
    focusKey = (state.rows.length - 1) + ".place";
    paint();
    return;
  }
  if (t.dataset.step !== undefined) {
    click("key");
    // Not lit yet: this tap is the one that brings the pair up.
    if (!t.classList.contains("on")) {
      focusKey = t.dataset.target;
      replaceNext = true;
      paint();
      return;
    }
    bump(t.dataset.target, +t.dataset.step);
    return;
  }
  if (t.dataset.key !== undefined) {
    click("key");
    focusKey = t.dataset.key;
    replaceNext = isNumeric(focusKey);
    paint();
    return;
  }
  if (t.dataset.pick !== undefined) {
    click("key");
    const r = dropRows[+t.dataset.pick];
    if (r) {
      const label = r._literal ? r.name : labelOf(r);
      setValue(focusKey, label);
      // Keep the coordinates. A geocoder row isn't in the bundled list, so
      // without this it reads as "not recognised" when the tally runs.
      if (r.latitude != null) {
        rememberPlace(label, { lat: r.latitude, lon: r.longitude,
                               admin1: r.admin1 || "", country: r.country || "" });
      }
    }
    focusKey = focusKey.split(".")[0] + ".count";
    replaceNext = true;
    dropIndex = -1;
    paint();
    return;
  }
  if (t.dataset.drop !== undefined) {
    state.rows.splice(+t.dataset.drop, 1);
    focusKey = null;
    renderRows();
    return;
  }
  if (t.dataset.ch !== undefined) { click("key"); type(t.dataset.ch); return; }
  if (t.dataset.num !== undefined) { click("key"); type(t.dataset.num); return; }

  if (t.dataset.act) click("key");
  switch (t.dataset.act) {
    case "space": type(" "); break;
    case "comma": type(", "); break;
    case "dot":   type("."); break;
    case "at":    type("@"); break;
    case "back":  backspace(); break;
    case "clear": clearField(); break;
  }
});

document.getElementById("memberbtn").addEventListener("click", () => {
  click("key");
  state.member = !state.member;
  paintMember();
});

document.querySelector("main").addEventListener("scroll", renderDrop);
window.addEventListener("resize", () => { fitAddButton(); renderDrop(); });

let submitting = false;
document.getElementById("done").addEventListener("click", () => {
  // A fast double tap, or Enter held down, must not file the same party twice.
  if (submitting) return;
  submitting = true;
  boop();
  // Nothing is rejected. Whatever is on screen gets stored; working out what
  // the grant can use happens on the review screen.
  SUBMISSIONS.push({
    id: Math.random().toString(36).slice(2, 10),
    at: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
    date: new Date().toLocaleDateString("en-CA"),
    name: state.name.trim(),
    email: state.email.trim(),
    // A ticked box counts the whole party as members. Easier to answer than
    // "how many of you are members?"
    members: state.member
      ? state.rows.reduce((n, r) => n + (parseInt(r.count, 10) || 0), 0) : 0,
    rows: state.rows.map(r => ({
      place: r.place.trim(),
      count: Math.max(1, parseInt(r.count, 10) || 1),
      paid_nights: parseInt(r.paid_nights, 10) || 0,
      free_nights: parseInt(r.free_nights, 10) || 0,
    })),
  });

  saveStore();

  const t = document.getElementById("thanks");
  t.classList.add("show");
  setTimeout(() => {
    t.classList.remove("show");
    reset();
    submitting = false;
  }, 2200);
});

function reset() {
  state = { name: "", email: "", member: false, rows: [blankRow()] };
  focusKey = null;
  renderRows();
  document.querySelector("main").scrollTop = 0;
}

/* ==========================================================================
   Key click.

   iPads have no Taptic Engine, so keypress vibration isn't available at any
   layer on this hardware; iPadOS exposes Keyboard Clicks but not Haptic
   Feedback, while iPhone exposes both. Audio is the confirmation channel the
   device actually has.

   Synthesised rather than loaded, to keep the page a single file with
   nothing to fetch. iOS won't start audio outside a user gesture, so the
   context is created lazily on the first tap and resumed on every tap in
   case iOS suspended it.
   ========================================================================== */

const SOUND_KEY = "sjima.sound.v1";
let soundOn = true;
try {
  const v = localStorage.getItem(SOUND_KEY);
  if (v !== null) soundOn = v === "1";
} catch (e) {}

let audioCtx = null;
let clickBuf = null;

/* One fixed noise sample, generated once and reused for every keypress, so
   every key sounds identical. Fresh randomness per press makes each tap
   subtly different, which the ear reads as noise rather than as a click. */
function buildClickBuffer(ctx) {
  const len = 0.020;
  const n = Math.ceil(ctx.sampleRate * len);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let seed = 12345;                       // fixed seed -> identical every load
  for (let i = 0; i < n; i++) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    const noise = (seed / 0x3fffffff) - 1;
    d[i] = noise * Math.pow(1 - i / n, 4.5);   // fast, soft decay
  }
  return buf;
}

/* Returns the context, creating it on the first tap. Both sounds go through
   here so the iOS gesture and resume rules live in one place. */
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    clickBuf = buildClickBuffer(audioCtx);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function click() {
  if (!soundOn) return;
  try {
    if (!ensureAudio()) return;
    const t = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = clickBuf;

    // Low-pass rather than band-pass. The high end is what reads as "clacky",
    // so roll it off instead of emphasising it. Lands close to the iPad's
    // own keyboard click.
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 1250;
    lp.Q.value = 0.7;

    const gain = audioCtx.createGain();
    const peak = 0.10;   // deliberately quiet
    gain.gain.setValueAtTime(peak, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.020);

    src.connect(lp); lp.connect(gain); gain.connect(audioCtx.destination);
    src.start(t); src.stop(t + 0.020);
  } catch (e) { /* audio is optional; never let it break data entry */ }
}

/* Submission sound: two short rounded tones, G5 then C6, a rising fourth.
   Triangle waves rather than sine so they carry across a lobby at low volume,
   rolled off at 2.6kHz so nothing is shrill. Each note starts slightly flat
   and glides up over 25ms, which is what makes it read as "boop" rather than
   as a beep. The whole thing is 300ms, well inside the 2.2s thank-you screen. */
const BOOP = [
  /* Hz,  start, length, peak */
  [ 783.99, 0.000, 0.105, 0.11 ],
  [1046.50, 0.135, 0.150, 0.12 ],
];

function boop() {
  if (!soundOn) return;
  try {
    if (!ensureAudio()) return;
    const t0 = audioCtx.currentTime + 0.01;
    for (const [hz, at, dur, peak] of BOOP) {
      const t = t0 + at;
      const osc = audioCtx.createOscillator();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(hz * 0.94, t);
      osc.frequency.exponentialRampToValueAtTime(hz, t + 0.025);

      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 2600;
      lp.Q.value = 0.7;

      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

      osc.connect(lp); lp.connect(g); g.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
  } catch (e) { /* audio is optional; never let it break data entry */ }
}

function setSound(on) {
  soundOn = on;
  try { localStorage.setItem(SOUND_KEY, on ? "1" : "0"); } catch (e) {}
}

/* Reload.

   Guided Access has no address bar and no pull-to-refresh, so without this
   there is no way to reload at all. Matters most right after a deploy.

   location.reload() can be served from cache, so this navigates to a fresh
   query string instead, forcing the HTML to be refetched. location.pathname
   drops any previous ?v= so they don't accumulate. The origin is unchanged,
   so stored sign-ins survive. */
function hasEntry() {
  if (state.name.trim() || state.email.trim()) return true;
  if (state.member) return true;
  return state.rows.some(r =>
    r.place.trim() || r.count !== "1" ||
    r.paid_nights !== "0" || r.free_nights !== "0");
}

/* Idle clear.

   A half-filled form left on the screen is one visitor's details sitting in
   front of whoever steps up next. Three minutes after the last touch it is
   wiped. The timer only runs when there is something to wipe, and any tap or
   keystroke anywhere restarts it, so nobody working slowly is ever cut off
   mid-entry. Submitting clears the form itself, which leaves nothing for the
   timer to find. */
const IDLE_MS = 180000;
let idleTimer = null;

function armIdleTimer() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  if (!hasEntry()) return;
  idleTimer = setTimeout(() => {
    idleTimer = null;
    if (hasEntry()) { reset(); paint(); }
  }, IDLE_MS);
}

["pointerdown", "keydown"].forEach(ev =>
  document.addEventListener(ev, armIdleTimer, { capture: true, passive: true }));

/* One button for both jobs. Reloading clears whatever is on screen, so a
   separate Clear would have done a subset of this.

   No confirmation. Someone reaches for this with a visitor waiting, and a
   prompt at that moment is one more thing to read and dismiss. The only thing
   it can discard is an entry that has not been submitted; every recorded
   sign-in is in storage and comes straight back after the reload.

   The query string is what forces a real refetch rather than a cached copy,
   which is what makes this the way to pick up a newly deployed version.
   location.pathname drops any previous ?v= so they never accumulate, and the
   origin is unchanged, so the stored sign-ins survive. */
document.getElementById("refresh").addEventListener("click", () => {
  click("key");
  location.replace(location.pathname + "?v=" + Date.now());
});

reset();

/* ==========================================================================
   Physical keyboard.

   Visitors use the on-screen keyboard; this is for building and testing, so
   letters don't have to be clicked one at a time. Both drive the same state.

     letters/digits   type into the focused field
     Tab / Shift-Tab  move between fields
     arrows           move through the suggestion list
     Enter            take the highlighted suggestion, or press Submit
     Escape           dismiss the suggestions
   ========================================================================== */

function allKeys() {
  return [...document.querySelectorAll("[data-key]")].map(el => el.dataset.key);
}

function flash(selector) {
  pressKey(document.querySelector(selector));
}

document.addEventListener("keydown", ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const keys = allKeys();
  const open = document.getElementById("drop").classList.contains("show");

  if (ev.key === "Tab") {
    ev.preventDefault();
    const at = keys.indexOf(focusKey);
    const next = ev.shiftKey
      ? (at <= 0 ? keys.length - 1 : at - 1)
      : (at === -1 || at === keys.length - 1 ? 0 : at + 1);
    focusKey = keys[next];
    replaceNext = isNumeric(focusKey);
    dropIndex = -1;
    paint();
    return;
  }

  if (open && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) {
    ev.preventDefault();
    const n = document.querySelectorAll(".opt").length;
    dropIndex = ev.key === "ArrowDown"
      ? (dropIndex + 1) % n
      : (dropIndex <= 0 ? n - 1 : dropIndex - 1);
    renderDrop();
    const selEl = document.querySelector(".opt.sel");
    if (selEl) selEl.scrollIntoView({ block: "nearest" });
    return;
  }

  if (ev.key === "Escape") {
    ev.preventDefault();
    dropIndex = -1;
    document.getElementById("drop").classList.remove("show");
    return;
  }

  if (ev.key === "Enter") {
    ev.preventDefault();
    const sel = document.querySelector(".opt.sel") ||
                (open ? document.querySelector(".opt") : null);
    if (sel) { sel.click(); dropIndex = -1; return; }
    document.getElementById("done").click();
    return;
  }

  if (ev.key === "Backspace") {
    ev.preventDefault(); flash('[data-act="back"]'); backspace(); return;
  }

  if (ev.key.length !== 1) return;           // ignore F-keys, Shift, etc.

  if (!focusKey) {                            // start typing with nothing focused
    focusKey = "0.place";
    replaceNext = false;
  }
  ev.preventDefault();
  const low = ev.key.toLowerCase();
  click("key");
  if (/[a-z0-9]/.test(low)) flash('.k[data-ch="' + low + '"]');
  else if (ev.key === " ") flash('[data-act="space"]');
  type(ev.key);                               // keep the case that was typed
});
